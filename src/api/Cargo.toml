[package]
name = "aide-ed-api"
version = "0.1.0"
description = "AideEd API"
authors = ["haras-unicorn <social@haras.anonaddy.me>"]
license = "MIT"
readme = "README.md"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
aide-ed-lib = { workspace = true }
aide-ed-macro = { workspace = true }
diesel = { version = "2.2.10", features = [
  "chrono",
  "postgres",
  "serde_json",
  "uuid",
], optional = true }
uuid = { version = "1.16.0", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
serde = "1.0.219"
serde_json = "1.0.140"

[features]
default = []
server = ["dep:diesel", "uuid/v4"]
